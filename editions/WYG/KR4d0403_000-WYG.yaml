body:
  text: 真山民集别集類三宋提要臣等謹案真山民集一巻宋真山民撰山民始末不可考宋末竄跡隠淪所至好題詠因傳於世或曰常自呼山民因以稱之或云李生喬嘗嘆其不愧乃祖文忠西山考真徳秀號曰西山諡曰文忠以是疑其姓真或云本名桂芳括蒼人宋末嘗登進士要之亡國遺民鴻㝠物外自成採薇之志本不求見知於世世亦無從而知之姓名里籍疑皆好事者以意為之未必遽確今從舊本題曰真山民集姑仍世之所稱而巳其集宋藝文志不著録明焦竑經籍志蒐宋人詩集頗備亦未載其名江湖小集始收之而亦多未備此本出浙江鮑氏知不足齋較他本為完善然皆近體無古詩元詩體要中録其陳雲岫愛騎驢七言古詩一首此本無之或詩本兩巻而佚其古體一巻或宋末江湖諸人皆不留意古體山民亦染其風氣均未可知然就其存者論之黍離麥秀抱痛至深而無一語懟及新朝則非惟其節至髙其安命知天識量亦不可及視謝靈運輩既授康樂之封而猶稱韓亡子房奮秦帝魯連恥者相去不啻萬萬矣詩格出於晩唐長短皆復相似五言如鬢秃難瞞老心寛不貯愁煙碧栁生色燒青艸返魂風竹有聲畫石泉無操琴棠醉風扶起栁眠鶯喚醒地皆宜避暑人自要趨炎飛花游蕩子古木老成人新塟塚無數後来人更多七言如欲談世事佛無語不管客愁禽自啼懶看世情人睡去怕傷時事莫吟休商嶺定無屠狗客雲臺寧有釣魚人囊空儘可償詩債脚倦猶能入醉鄉雕鎪花栁春無迹沐浴山川雨有思炭為驟寒偏索價酒因不飲懶論交之類皆不出晩唐纖佻麤獷之習至於五言之鳥聲山路静花影寺門深風蟬聲不定水鳥影同飛與鷗分渚泊邀月共船眠牕月燈昏見岩泉雨歇聞水清明白鷺花落失青苔曳杖雲同出開簾山自来寒塘倒山影空谷荅樵歌七言之泉石定非騎馬路功名不上釣魚船水禽與我共明月蘆葉同誰吟晩風隔浦人家漁火外滿江秋思笛聲中小窓半夜青燈雨幽樹一庭黄葉秋澗暗只聞泉滴瀝山青賸見鷺分明㡬畝桑麻春社後數家雞犬夕陽中則頗得晚唐佳處矣一邱一壑足資延賞要亦宋末之翹楚也乾隆四十六年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
