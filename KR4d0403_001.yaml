body:
  text: 真山民集宋真桂芳撰幽居雜興松桂小菟裘山屝幽更幽蜂王衙早晩燕子社春秋髩秃難瞞老心寛不貯愁年来把鋤手無復揖公侯新春餘凍雪初乾初晴日驟暄人心新嵗月春意舊乾坤煙碧栁生色燒青草返魂東風無厚薄隨例到衡門光霽閣晩望一閣納萬象危䦨俯渺茫白沙難認月黄葉易為霜宿鳥投烟嶼歸樵趂野航孤吟誰是伴漁笛起滄浪興福寺為厭市喧雜攜詩米此吟鳥聲山路静花影寺門深樓閣莊嚴界池塘清浄心松風亦好事送客出前林夏晩江行行盡山頭路江空帶夕暉風蟬聲不定水鳥影同飛蕭散烏藤杖輕鬖白苧衣試呼垂釣者分我半苔磯修眞院訪崔道士竹扉蒼蘚墻林下小丹房風定香烟直月斜簾影長瀹茶泉味别㸃易露痕香安得棲塵外求師却老方春遊和胡叔方韻春光潑眼明占勝得新亭棠醉風扶起栁眠鶯唤醒非無盃泛緑安得鬢皆青且事日為樂歌聲莫暫停山亭避暑怕礙清風入丁寜莫下簾地皆宜避暑人自耍趨炎竹色水千頃松聲風四簷此中有幽致多取未傷廉三山旅夜獨坐本無况凄涼更旅中檻低簷碍月窗破紙吟風隣館笛三弄譙樓鼔二通半觴聊自適新荔擘輕紅枕上偶成長夜更難曉天寒吟思清夢魂山館枕燈影雪窗檠守拙踈生理安貧識世情凄風響簷竹豈是不平聲泊白沙渡日暮片帆落渡頭生暝烟與鷗分渚泊邀月共船眠燈影漁舟外湍聲客枕邊離懐正無奈況復聼啼鵑夜話無上人房蒲團一榻上坐到夜將分窗月燈昬見巖泉雨歇聞茶甌勝飲酒禪語當論文只恐紅塵跡涴師松下雲獨坐寒齋淡無味孤坐思悠悠時事三緘口年光一轉頭有書遮老眼無藥療閒愁假使丹心在衰遲也合休春日韶光今幾許我欲問流鶯花影掃不去草根鋤又生心空諸妄息身老萬縁輕正是春風好幽蘭不肯爭曉行山間出門誰是伴只約瘦藤行一二里山徑兩三聲曉鶯亂峰相出沒初日乍隂晴僧舎在何許隔林鐘磬清山間次季芳韻好山多在眼塵事少闗心風竹有聲畫石泉無操琴許猿分野果留鶴守雲林不是閒中客誰来此地吟春感春光元自好我却為春愁但見栁青眼不知人白頭一身浮似寄百嵗去如流賴有芳樽在花前日醉遊春曉園中緑陰留我立淸曉小䦨東林外一鳩雨栁邊雙燕風吟懐愁渺渺春事去匆匆莫恨芳菲盡葵榴花又紅溪行春暖溪西路行吟又㡬迴水清明白鷺花落失青苔雲過日吞吐樹揺風往来漁歌聼未了欲去又徘徊除夜約張梅境飲今日又除夕君能為我来燭光紅照席酒浪緑揺杯臘帶愁吟去春隨笑臉回相看俱健在莫管嵗華催渡江之越宿蕭山縣昨夜大江舟今宵小驛樓隻身千里客孤枕一燈秋市酒難成醉鄉書莫寄愁胸中無史記浪作㑹稽游宿寳勝寺苦吟吟未了只向兩廊行月去塔無影風来鐸有聲禪心隨水净佛眼共燈明安得雲邊住與僧分此情閒居虛明兩竹窗濟楚一書房風動鳥移樹花香蝶過墻身安知病少晝静覺春長未必全無事終焉也勝忙兵後寓舎送春觸景多懐舊凭欄易愴神飛花游蕩子古木老成人世換山如醉田荒草自新鄉闗渺何處回首暗風塵樓居攜書来過此便覺少塵埃簷冷留雲宿窗明報月来閒愁山隔斷幽夢鳥呼回湖海元龍去従渠俗子猜蘭溪舟中一舸下中流西風兩岸秋櫓聲揺客夢帆影挂離愁落日魚鰕市長煙蘆荻洲篙人夜相語明發又嚴州兵後劉秀寛見過冉冉嵗云暮閒居安所之途窮身是累痛定語猶悲衰鬢數莖雪空囊一巻詩儒衣例如此惜也不逢時清明清明今日是原上一經過新塟塜無數未来人更多此生曽悟否不樂復如何莫待澆墳土樽前且醉歌臨江曉行茅舎亂雞聲踈林淡見星霜輕留草緑霧暗失山青蹤跡去来燕交游聚散萍浮生原是客不必恨飄零寄郭月篷煙波秋草外活計一漁篷淡月明寒葦新霜醉曉楓身雖殊出處道豈有窮通俯仰看人面何如數過鴻舟中峽口亂山如碧玉處處見鵑花水漲傍分港舟行倒走沙宿依沽酒市飯過釣魚家喜脱風波險推篷數暝鴉次韻章劍溪山居想無書赴隴林鶴莫驚猜曳杖雲同出開簾山自来池堪供洗硯籬不碍觀梅静倚長松立藤花㸃翠苔夏日虛窗暑亦涼境静晝偏長樹色煙明滅蟬聲風抑揚家貧書是業身老睡為鄉赤日黄埃客紛紛為底忙嵗除寄王中齋徂嵗已匆匆何人似此翁事雖隨世異道不與冬窮身老心猶壯髯斑臉自紅椒花一盃酒明日又春風宋道士同游白雲闗扶攜方外友来入白雲闗八九峯如畫兩三人倚欄棋聲敲竹外簾影落花間一曲瑶琴罷翠陰生晝寒妙因寺次施敬所韻松蘿一徑陰踏破白雲深約客分茶供逢僧倚竹吟鼠留香篆迹禽和閣鈴音話乆不知晩新螢照出林晩春有恨青春老無營白晝長葉新林換緑花落地生香雨意一畨足人家百事忙為儒竟成誤悔不早農桑冬雪雪凍飛禽少林深落葉多寒塘倒山影空谷荅樵歌不有梅花在其如詩思何霜風吹落㡌應嘆鬢絲皤新涼煙火人幽處田園秋暮時深村人到少閏月稻黄遲旋決渠分水新編竹補籬地爐煨芋栗莫遣貴人知江樓秋夕樓髙古城遶無奈漏聲催幽夢風吹斷新吟月送来江長漁唱逺雲冷鴈聲哀明日重陽酒黄花開未開初夏訪劉道士白雲隨杖履伴我到山房暑薄疑天别林深見路長术芝皆道味花竹亦詩香更待荷花後来分半榻涼春行東風物物新花外步淸晨蕉葉巻舒雨鳩聲問荅春園林三月景詩酒百年身試數交遊侣如今有幾人孤標上人留宿山僧留我宿我亦似山僧香茗半甌雪寒虀一筯氷廊風響黄葉壁雨暗青燈㕘透詩三昧何須契一乗秋晩暮色入江郊霜風兩鬢毛笛聲吹月落詩興挟秋髙謝絶南柯蟻留連左手螯孤燈竹窗底危坐一歌騷李修伯山居俗子自不到幽扉何必扃苔衣和月卧山雨雜泉聴有髪徒斑白無名入汗青未應閒此事尚可掃𤣥經寒燈幾撥盡借問夜何其舊夢青氊在新愁白髪知昔為三遶鵲今作五藏龜多謝梅梢月留人得睡遲道逢過軍投宿山寺窮途欲焉往薄暮此相投蟋蟀數聲雨芭蕉一寺秋鄉闗来枕畔時事上眉頭嘗歎為僧好今逢更說愁述懐不敢尤人敢怨天愁来覔酒醉来眠五窮有鬼徧相虐九轉無丹别自全遊食懼違新下令力耕苦乏舊存田靈臺坐受憂兵觸荏苒霜華剥鬢𤣥春曉雨破曉簷花未放乾披衣和夢倚䦨干釀成苔暈地猶濕老盡鶯聲風正寒無客醉敲金鐙響有人睡怯翠衾單牡丹一夜成消瘦下却珠簾不忍看西湖圖兩袖春風一杖藜等閒踏破栁橋西雲開逺嶂碧千疊雨過落花紅半溪青斾有情邀我醉黄鶯無恨為誰啼東城正在桃林外多少遊人逐馬蹄隱懐樣不趨時合便休都將往事付東流眼看浮世自今古迹與孤雲同去留泉石定非騎馬路功名不上釣魚舟有時但得句無問只與漁歌互唱酬游鳯棲寺十載重游古鳯棲蓮宫新遶緑楊堤欲談世事佛無語不管客愁禽自啼苔滑空廊妨散步塵昬老壁失留題僧家田地鄰家種菜甲春風綠滿畦漁浦晩秋旅懐西風吹夢越中游剪剪輕寒入短裘雁字不將鄉信寫蛩聲空和旅吟愁郵亭冷雨孤燈夜漁市斜陽一笛秋是處山川即吾土仲宣何用怯登樓泊舟嚴灘天色微茫入暝鐘嚴陵灘上繫孤篷水禽與我共明月蘆葉同誰吟晩風隔浦人家漁火外滿江秋思笛聲中雲開休望飛鴻影身即天涯一斷鴻題永嘉夢草堂留得斯堂萬古名江山不敢閉英靈池光曾染吟邊墨草色猶如夢裏青南浦詩香流未歇東家魂冷喚難醒當時園栁俱塵迹惟有鳴禽尚可聴連城春夜留别張建溪飛絮游絲客子心連城那忍遽分襟青燈應見詩情苦濁酒不如交味深一榻暖風棲竹屋半䦨淡月立花陰離懐今夜先収拾盡付明朝馬上吟夜坐匹馬平生汗漫遊如今寂寞老林楸小窗半夜青燈雨幽樹一庭黄葉秋懶看世情寜睡去怕傷時事莫吟休寒蛩可是知人意來到莎根只說愁春行短㡌輕衫步履遲㣲暄天氣乍晴時池融嫩碧消殘凍春剪新紅綴舊枝嵐翠滴衣堪入畫禽聲到耳足供詩東風苦欲招人醉頻掉橋西賣酒旗初冬林葉新經數夜霜地爐獨擁一山房塵書邀我共高閣濁酒勸人歸醉鄉費省家貧還似富身閒日短亦如長梅花苦欲催吟興又破梢頭半㸃香東粤廟頹䦨斜照網蛛絲陳迹凄凉萬古悲柘水尚鳴亡國怨山松曽見受封時碑因苔蝕無完字城為田侵失舊基當日東甌知幾戰如今贏得一荒祠歲暮顔不常朱鬢易斑流光難駐兩跳丸一年又是等閒過百嵗只消如此看把酒何曾長在手種桃能得幾凭欄痴人醉夢不知醒日夜雙眉抵死攅閒居漫賦紛紛裘馬走紅塵賴得閒邊可著身商嶺定無屠狗客雲臺豈有釣魚人溪山蕭散青鞋履風月夷猶烏角巾萬事如棋君看取一畨局靣一畨新三峯寺寂寞烟林噪亂鴉青鞋步入野僧家雲深不碍鐘聲出日轉還移塔影斜廊下蝸黏㳂砌蘚佛前蜂戀挿瓶花竹床紙帳清如水一枕松風聴煮茶江頭春日風煖旗亭煮酒香醉醒始悟是他鄉駕言行邁路千里豈不懐歸天一方春事漸消鶯語老離愁偏勝桞絲長無聊莫向城南宿淡月梨花正斷腸次韻潘恕堂見寄抱瓮區區老漢陰空齋擁鼻日長吟青山隔絶市朝靣白髪消磨豪傑心書既無成休學劔貴無可買恥言金情知不入鴛鸞侣賴有鷗盟尚可尋初夏一夜薫風帶暑回雨天濃翠暗庭槐不隨春去鶯猶在好競時妝榴又開剪尺旋裁新白苧盃盤聊薦舊青梅篋中敝扇投閒乆依舊團團入手来閒吟初冬一架琴書一筆床杜門荏苒送年光囊空儘可償詩債脚倦猶能入醉鄉既老菊花偏耐乆未開梅蘂已先香眼邊管領閒風景不識人間更有忙奉和春遊呈雲耕叔祖節遇中和景漸暄自摩倦眼望前村雕鎪花栁春無迹沐浴山川雨有恩憶昔踏青終日醉如今垂白幾人存未應便作衰翁看藉草猶堪倒一樽夜飲趙園次徐君實韻銀臺絳蠟淚成堆四靣軒窗盡放開花影忽生知月到竹梢㣲響覺風来豪揮彩筆詩千首醉倚紅妝酒百杯遊玩未䦨歸未得髙城漏箭幾相催平章命萬甲蟠胸老氣雄將星光照海雲東聲名宣尉裴中立地步平章韓魏公大纛髙牙山水縣褒衣博帶藻芹宫書生端為斯文喜俎豆先行軍旅中幽棲鶴䕶松扉乆不開蒲團端坐思悠哉故交只向夢中見閒事不従心上来雙屐躡雲春採藥一笻挂月夜觀梅東風似見山童懶自與幽人掃徑苔讀劉元城言行錄一掃權奸九十章七州不憚歴炎荒黄粱富貴百年短青史是非千載長丞相雖存心已死先生既葬骨猶香向令鐵漢常留在天下何縁得靖康次李林居春曉遊園滅沒晨曦弄淡晴追隨杖履竹間亭花逢酒侣容先醉栁見詩人眼剰青三月光陰半流水百年身世一浮萍啼鶻只管催春去不道衰翁已怕聴聖果院訪忠上人不值管領東風入杖藜落梅香裏已招提苔痕一徑白雲濕花影半窗紅日低欲見髙僧聊爾耳便乘餘興去来兮葛藤有話無人共付與隔林幽鳥啼山行林梢初日弄陰晴露浥溪花笑欲迎澗暗只聞泉滴瀝山青剰見鷺分明逺峰忽轉還如遶險逕徐行亦似平莫謂詩成無與和風篁也解作吟聲秋夜次葉一山韻自笑秋来似轉蓬偶然飛落過山中一燈幽館菊花雨孤枕小樓梧葉風涉世悠悠旋磨蟻懐人杳杳寄書鴻浮生何預光陰事抵死相催作老翁杜鵑花得紅字愁鎖巴雲往事空只將遺恨寄芳叢歸心千古終難白啼血萬山多是紅枝帶翠煙深夜月魂飛錦水舊東風至今染出懐鄉恨長挂行人望眼中客中臨歸仍送游教諭建括相望天一涯快哉此地話襟期芹邊春煖幾盃酒門外月髙千首詩去去先生此休矣栖栖遊子暮何之送行折了郵亭栁歸卧白雲歌紫芝自適年来心迹兩悠悠若比孤雲儘自由既不貪榮安有辱縦饒無樂亦何憂一絲風月嚴陵釣千里關山季子裘到底行藏定誰是試將心事問沙鷗永嘉秋夕風戰枮桐敲紙窗擁裘無寐夜偏長樵樓三鼔夜将午雲雁數聲天正霜寓世此身驚逆旅寛懐何處不吾鄉江頭風景日堪醉酒美蟹肥橙橘香醉題齋壁此是閒中安樂窩従渠忙處為奔波人心少似秋胡婦世事多㕘春夢婆但把功名同蟻蛭定無榮辱到漁蓑醉鄉境界偏寛闊天地多歸一浩歌客中遇鄉友季芳逺歸省親河梁邂逅話襟期獵獵西風透裌衣酒臉未隨紅葉醉鄉心先逐白雲飛客中送客難為别山上安山胡不歸借使家書君可寄此間無復問庭幃山人家片雲隔㫁嶂西峰三兩山花屋角紅幾畝桑麻春社後數家雞犬夕陽中拾薪澗底青裙婦倚杖簷間白髪翁我亦願来同隱者種桃早晩趂東風劉伯山寄隱寄隠幽蹤何處尋春風十里薜蘿深青山不說是非事黄鳥自賡長短吟百折畏途休著脚十分明月是知心不應誤放桃花出惹得漁翁話古今朱溪澗路轉峰回又一村天寒大半掩柴門雲融山脊嵐生翠水嚼沙洲樹出根任擁重裘風亦冷未投荒店月先昬今宵只傍梅花宿贏得清芬入夢魂丹山書堂作室懸知要肯堂而翁家學頗増光一朝衿佩儒簮合千古詩書屋壁香鑑曲烟霞歸羽館鍾山風月落僧房如何只掲精廬扁解續斯文氣燄長閒中敢咎章縫解誤人甘於閒處著閒身腹中書在温仍熟夢裏詩成記不真引鶴徐行三逕曉約梅同醉一壺春今朝有喜誰知得新换銜頭號散民送雲泉入山薜蘿叢裏鬱青青别是幽棲一段清水色山光皆畫本蟬聲禽語亦吟情人今不改衣冠古道重方知富貴輕為語俗交休見問已従麋鹿訂新盟冬暮小齋布襪青鞋敝絮袍松扉柴几小衡茅雲酣纔釀臈三月梅吐又横春一梢炭為驟寒偏索價酒因不飲懶論交窮年兀兀従人笑未用多方作解嘲宿南峯寺禪房花木鎖深幽借與詩人信宿留幡影分米半廊月磬聲敲破一林秋僧偏好事能青眼佛本無心亦白頭試問青松峯外鶴閒邊曽見幾人遊嵗朝畫角聲中舊嵗除新年喜氣滿屠酥陽和忽轉氷霜後元氣更如天地初晩色催詩歸草夢春光隨筆上桃符閉門賀客相過少静對梅花自看書春曉山行風掃連陰作快晴瘦笻伴我出山扃路従初日紅邊過人在野花香裏行古木殊無趨世態幽禽懶作弄春聲棕鞋踏遍山南北只與白雲相送迎王亷使鼻祖名髙三諌官耳孫玉立又臺端氣增浙左霜威動面帶終南山色寒攬轡肯教狼卧地歸班便合豸峩冠公餘詩興清於雪細嚼梅花入肺肝幽興不賦千鍾賦一簞天公有意養痴頑書猶能看未曾老詩亦莫吟方是閒寛著庭除貪貯月少栽竹樹要觀山空堦兩日無行迹又上苔花幾㸃斑梅仙山梅福鍊丹地西都不知壽安用獨長年縦有丹爐在難吹漢火燃螢火㣲蹤一腐草霜重不禁秋想悟浮生短常為秉燭遊蜜蜂釀成百花脾聊爾了口腹人知口中甘誰料腹中毒觀書自歎皓首抱遺經堪憐誤一生空共蠧蟲飽自作忍饑聲吉水夜泊入夜始維舟黄蘆古渡頭眠鷗知讓客飛過蓼花洲草草枯根不死春到又敷榮獨有愁根在非春亦自生百舌花開報曉晴巧弄百般聲未可嫌饒舌猶勝鴈不鳴秋扇人心有炎涼我心無歡悲篋中重自珍㑹有薫風時訪李延不值白雲滿空山山空人未歸柱杖莫敲門恐驚白雲飛七夕世上癡兒女争趨乞巧筵婦鳩甘抱拙不諂鵲橋仙楊妃三郎掩面馬嵬坡生死恩深可奈何瘞土驛傍何足恨潼闗戰處骨埋多水墨海棠不將翠袖捲紗紅怪得陳𤣥奪化工想是太真春睡足夢魂正在黒甜中三月晦日與邵石諸友閒遊東園分得空字韶光収拾太匆匆眼底浮花一掃空留得數枝紅藥在五更分付與東風逰春嘲少年錦袍朱帶玉花驄著意追歡紫陌東只道春風屬楊栁不知楊栁有秋風山間早春小桃枝上認年華隨分紅開一兩花將謂春風只城市也吹春色到山家三月晦日九十風光能有幾東風遽作逺行人樽前莫惜今朝醉明日鶯聲不是春髙帝未央前殿養親時想記當年俎上危借問杯羮何等語如今安用玉巵為晚歩未暝先啼草際蛩石橋暗度晩花風歸鴉不帶殘陽老留得林梢一抹紅春閨詞愁鎖眉尖未肯消何心更待兩蛾嬌一春螺黛渾無用付與東風染栁條山間秋夜夜色秋光共一䦨飽収風露入脾肝虛簷立盡梧桐影絡緯數聲山月寒新年籹㸃春光到眼邊凍消殘雪暖生烟杏桃催換新顔色惟有寒梅老一年九日懶把黄花挿滿頭正縁老大見花羞年来頗恨儒冠誤好倩西風吹去休醉餘再賦堪歎詩翁酒興豪醉餘猶復一登髙西風抵死相揺撼争奈儒冠裹得牢補遺陳雲岫愛騎驢君不學少陵騎驢金華春一生旅食長悲辛又不學浪仙騎驢長安市凄涼落葉秋風裏却學雪中騎驢孟浩然冷濕銀鐙敲吟鞭梅花溪上日来往身迹懶散人中仙有時清霜松下路松風蕭蕭驢耳竪據鞍傲兀四無人牧子騎牛相爾汝勸君但騎驢行路穩姑徐徐九折畏途鞭快馬年来曾覆幾人車真山民集
